<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Water Wave Rafting</title>
    <meta name="description"
      content="Get in touch with Water Wave Rafting. Find our location, meet our team, or send us a message for reservations and inquiries.">
    <meta name="author" content="Ulonna Godspower">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-raftingbw.png" alt="Rafting Company Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-hero">
            <h1>Contact Us</h1>
            <p>123 Main River Street, Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <div class="contact-grid">
            <section class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.018299387552!2d-122.4194155!3d37.7749295!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80859a6d00690021%3A0x4a501367f076adff!2sSan%20Francisco%2C%20CA!5e0!3m2!1sen!2sus!4v1611234567890!5m2!1sen!2sus"
                  width="100%" height="450" loading="lazy"></iframe>
            </section>

            <section class="form-container">
                <form action="#" method="post">
                    <div class="form-item">
                        <label for="user_name">Name</label>
                        <input type="text" id="user_name" name="user_name" placeholder="Full Name"
                          required>
                    </div>
                    <div class="form-item">
                        <label for="user_email">Email</label>
                        <input type="email" id="user_email" name="user_email"
                          placeholder="Email Address" required>
                    </div>

                    <fieldset>
                        <legend>Message Purpose</legend>
                    
                        <label for="general">
                            <input type="radio" id="general" name="purpose" value="general"> General Inquiry
                        </label>
                    
                        <label for="reservation">
                            <input type="radio" id="reservation" name="purpose" value="reservation"> Reservation
                            Question
                        </label>
                    
                        <label for="suggestion">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion"> Website Suggestion
                        </label>
                    </fieldset>

                    <div class="form-item">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4"
                          placeholder="Type here"></textarea>
                    </div>

                    <div class="form-item checkbox">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Please subscribe me to the monthly
                            newsletter</label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </form>
            </section>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employes.jpg" alt="Manager Profile">
                    <figcaption>John martins - General Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employes_james.jpg" alt="Lead Guide Profile">
                    <figcaption>Jane Smith - Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employes_mara.jpg" alt="Safety Officer Profile">
                    <figcaption>Mike Ross - Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Water Wave | Ulonna Godspower</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook Icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.png" alt="LinkedIn Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.png"
                  alt="Instagram Icon"></a>
        </nav>
    </footer>
</body>

</html>
